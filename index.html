<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCTIERS - Rankings</title>
<style>
  :root{
    --background:#10161d;
    --card:#121822;
    --border:#18202a;
    --accent:#1e2939;
    --muted:#8a94a6;

    --ht1-foreground:#e8ba3a; --ht1:#6d5d2c;
    --ht2-foreground:#c4d3e7; --ht2:#5e6979;
    --ht3-foreground:#f89f5a; --ht3:#6b4b36;
    --ht4-foreground:#81749a; --ht4:#303144;
    --ht5-foreground:#8f82a8; --ht5:#2b2c3d;

    --lt1-foreground:#d5b355; --lt1:#584c25;
    --lt2-foreground:#a0a7b2; --lt2:#4a505a;
    --lt3-foreground:#c67b42; --lt3:#593722;
    --lt4-foreground:#655b79; --lt4:#2c2e40;
    --lt5-foreground:#655b79; --lt5:#262a3a;

    --na-foreground:#d95c6a; --na:#442228;
    --placement-1:#e5ba43; --placement-2:#808c9c; --placement-3:#b56326; --placement-other:#1e2634;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--background);
    color:#e6e9ef;
    font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
    min-height:100vh;
  }
  a{color:inherit;text-decoration:none;}

  header.topnav{
    display:flex;align-items:center;gap:28px;
    padding:14px 32px;
    border-bottom:1px solid var(--border);
    background:#0d1218;
    position:sticky;top:0;z-index:20;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:.5px;margin-right:auto;}
  .brand img{width:28px;height:28px;object-fit:contain;border-radius:6px;}
  .navlinks{display:flex;gap:22px;font-size:14px;color:var(--muted);}
  .navlinks a{display:flex;align-items:center;gap:6px;padding:6px 2px;border-bottom:2px solid transparent;transition:.15s;}
  .navlinks a:hover{color:#fff;}
  .navlinks img{width:16px;height:16px;opacity:.75;}

  main{max-width:1352px;margin:0 auto;padding:28px 16px 80px;}

  .tabstrip{
    display:flex;gap:4px;overflow-x:auto;padding:0 4px;margin-bottom:-2px;position:relative;z-index:2;
  }
  .tab{
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    gap:4px;min-width:96px;padding:10px 18px 10px;
    border:2px solid var(--border);border-bottom:none;
    border-radius:16px 16px 0 0;
    background:transparent;color:#5b6472;
    font-size:13px;font-weight:700;text-transform:capitalize;
    cursor:pointer;
  }
  .tab img{width:26px;height:26px;}
  .tab.active{background:rgba(30,41,57,.5);color:#e6e9ef;box-shadow:inset 0 -2px 0 #fff;}

  .card{
    background:var(--card);
    border:2px solid var(--border);
    border-radius:0 12px 12px 12px;
    padding:26px 28px;
  }
  .card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  .card-head h1{font-size:22px;margin:0;display:flex;align-items:center;gap:10px;}
  .card-head h1 img{width:26px;height:26px;}

  .info{display:flex;align-items:center;gap:10px;background:var(--accent);border:1px solid var(--border);border-radius:10px;padding:6px 12px;}
  .info img{width:34px;height:34px;object-fit:contain;}
  .info .lbl{font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:700;}
  .info .ip{font-size:13px;font-weight:700;background:#0d1218;padding:2px 8px;border-radius:6px;}

  .rows{display:flex;flex-direction:column;gap:10px;}
  .row{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:8px;border-radius:10px;
    border:1px solid transparent;
    transition:background .15s;
  }
  .row:hover{background:rgba(255,255,255,.03);border-color:var(--border);}

  .rankbox{
    width:150px;min-width:150px;height:56px;position:relative;
    display:flex;align-items:center;border-radius:6px;overflow:hidden;
  }
  .rankbox img.shimmer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.9;}
  .rankbox .num{
    position:relative;z-index:1;font-style:italic;font-weight:800;font-size:30px;
    padding-left:10px;text-shadow:0 3px 1px #232323;
  }
  .rankbox img.skin{position:absolute;right:26px;bottom:2px;z-index:1;filter:drop-shadow(-4px -2px 1px rgba(0,0,0,.47));}

  .who{width:230px;min-width:180px;}
  .who h2{margin:0;font-size:21px;font-weight:700;color:#cfd6e2;}
  .who .title-line{display:flex;align-items:center;gap:6px;margin-top:3px;color:#8a94a6;font-size:13px;}
  .who .title-line img{width:18px;height:18px;}
  .who .pts{color:#5b6472;}

  .region{
    width:44px;height:44px;min-width:44px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:15px;
    background:var(--na);color:var(--na-foreground);
    margin-left:auto;
  }

  .tiers{display:flex;gap:6px;flex-wrap:wrap;margin-left:6px;}
  .slot{width:44px;display:flex;flex-direction:column;align-items:center;position:relative;}
  .slot .icon{
    width:34px;height:34px;border-radius:999px;background:rgba(0,0,0,.5);
    display:flex;align-items:center;justify-content:center;border:2px solid var(--c);
  }
  .slot .icon img{width:19px;height:19px;object-fit:contain;}
  .slot strong{
    position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);
    font-size:11px;padding:1px 5px;border-radius:8px;
    background:var(--c);color:var(--cf);white-space:nowrap;
  }

  footer{
    text-align:center;color:#465066;font-size:12px;padding:26px 0 10px;
  }

  @media (max-width:820px){
    .who{width:150px;}
    .tiers{width:100%;justify-content:flex-start;margin-left:0;margin-top:8px;order:5;}
    .region{margin-left:0;}
    .info{display:none;}
  }
</style>
</head>
