<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCTiers - Rankings</title>
    <!-- Font Awesome Icons Link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        
        body {
            background-color: #0f131a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .site-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #21262d;
        }
        .logo {
            color: #ff7700;
            font-weight: 900;
            letter-spacing: 2px;
            font-size: 24px;
        }
        .header-buttons button {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-left: 10px;
        }
        .btn-orange { background-color: #ff9933; color: #000; }
        .btn-dark { background-color: #21262d; color: #fff; }
        .btn-discord { background-color: #5865F2; color: #fff; }
        
        /* Category Navigation */
        .category-nav {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .tab {
            background: #161b22;
            border: none;
            color: #8b949e;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }
        .tab.active {
            background: #ff9933;
            color: #000;
        }

        /* Search & Filter Bar */
        .filter-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }
        .search-input {
            background: #161b22;
            border: 1px solid #30363d;
            padding: 10px 15px;
            border-radius: 6px;
            color: #fff;
            width: 250px;
            outline: none;
        }
        .region-select {
            background: #161b22;
            border: 1px solid #30363d;
            padding: 10px 15px;
            border-radius: 6px;
            color: #fff;
            outline: none;
            cursor: pointer;
        }

        /* Leaderboard Container */
        .leaderboard-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .player-card {
            display: flex;
            align-items: center;
            background: #161b22;
            margin-bottom: 12px;
            padding: 15px 20px;
            border-radius: 8px;
            justify-content: space-between;
            border-left: 6px solid #30363d;
        }
        .rank-1 { border-left-color: #f1e05a; background: linear-gradient(90deg, #262111 0%, #161b22 50%); }
        .rank-2 { border-left-color: #8b949e; }
        .rank-3 { border-left-color: #d1863b; }
        
        .rank-number {
            font-size: 22px;
            font-weight: bold;
            width: 45px;
        }
        .player-info {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-grow: 1;
        }
        .avatar {
            border-radius: 4px;
        }
        .player-name {
            font-weight: bold;
            font-size: 17px;
            display: block;
            color: #fff;
        }
        .player-title {
            font-size: 11px;
            color: #8b949e;
            text-transform: uppercase;
        }
        .points {
            color: #ffb347;
        }
        .region-badge {
            background: #4a154b;
            color: #e784e7;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            margin-right: 20px;
        }
        .badges {
            display: flex;
            gap: 6px;
        }
        .badge {
            padding: 5px 10px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 4px;
            border: 1px solid #30363d;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .badge.ht4 { background: #1b3622; color: #3fb950; }
        .badge.ht3 { background: #3b2a1a; color: #d29922; }
        .badge.lt3 { background: #1f242d; color: #58a6ff; }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header class="site-header">
        <h1 class="logo">XTREMETIERS</h1>
        <div class="header-buttons">
            <button class="btn-orange">Leaderboard</button>
            <button class="btn-dark">Compare Matrix</button>
            <button class="btn-discord">Discord</button>
        </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="category-nav">
        <button class="tab active"><i class="fa-solid fa-trophy"></i> OVERALL</button>
        <button class="tab"><i class="fa-solid fa-shield-halved"></i> VANILLA</button>
        <button class="tab"><i class="fa-solid fa-khanda"></i> SWORD</button>
        <button class="tab"><i class="fa-solid fa-wand-magic-sparkles"></i> NETHPOT</button>
        <button class="tab"><i class="fa-solid fa-gem"></i> DIAMOND POT</button>
        <button class="tab"><i class="fa-solid fa-gamepad"></i> UHC</button>
        <button class="tab"><i class="fa-solid fa-hammer"></i> MACE</button>
        <button class="tab"><i class="fa-solid fa-skull"></i> SMP</button>
    </nav>

    <!-- Search & Filter Bar -->
    <div class="filter-bar">
        <input type="text" class="search-input" placeholder="Search operational indices...">
        <select class="region-select">
            <option>All Global Regions</option>
            <option>Asia (AS)</option>
            <option>North America (NA)</option>
            <option>Europe (EU)</option>
        </select>
    </div>

    <!-- Main Leaderboard Container -->
    <main class="leaderboard-container">
        
        <!-- Rank 1 -->
        <div class="player-card rank-1">
            <div class="rank-number">1.</div>
            <div class="player-info">
                <img src="https://minotar.net/avatar/jintudeka/50.png" alt="Avatar" class="avatar">
                <div>
                    <span class="player-name">jintudeka</span>
                    <span class="player-title">Combat Master <span class="points">(1584 points)</span></span>
                </div>
            </div>
            <div class="region-badge">AS</div>
            <div class="badges">
                <span class="badge ht4"><i class="fa-solid fa-book"></i> HT4</span>
                <span class="badge ht3"><i class="fa-solid fa-fire"></i> HT3</span>
                <span class="badge lt3"><i class="fa-solid fa-shield"></i> LT3</span>
            </div>
        </div>

        <!-- Rank 2 -->
        <div class="player-card rank-2">
            <div class="rank-number">2.</div>
            <div class="player-info">
                <img src="https://minotar.net/avatar/SaumyaXtreme/50.png" alt="Avatar" class="avatar">
                <div>
                    <span class="player-name">SaumyaXtreme</span>
                    <span class="player-title">Combat Master <span class="points">(946 points)</span></span>
                </div>
            </div>
            <div class="region-badge">AS</div>
            <div class="badges">
                <span class="badge ht3"><i class="fa-solid fa-fire"></i> HT3</span>
                <span class="badge ht4"><i class="fa-solid fa-book"></i> HT4</span>
            </div>
        </div>

        <!-- Rank 3 -->
        <div class="player-card rank-3">
            <div class="rank-number">3.</div>
            <div class="player-info">
                <img src="https://minotar.net/avatar/FyreDeft/50.png" alt="Avatar" class="avatar">
                <div>
                    <span class="player-name">FyreDeft</span>
                    <span class="player-title">Combat Master <span class="points">(844 points)</span></span>
                </div>
            </div>
            <div class="region-badge">AS</div>
            <div class="badges">
                <span class="badge lt3"><i class="fa-solid fa-khanda"></i> LT5</span>
                <span class="badge ht3"><i class="fa-solid fa-axe"></i> HT5</span>
            </div>
        </div>

    </main>

</body>
</html>
