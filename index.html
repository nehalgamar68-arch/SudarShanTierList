<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUDARSHAN MCTIERS - Official Leaderboard</title>
    
    <!-- FontAwesome & Google Fonts -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #07090e;
            --bg-card: #0f141d;
            --bg-card-hover: #161e2b;
            --bg-tab: #121824;
            --bg-tab-active: #1e283b;
            --border-color: #1a2332;
            --border-highlight: #2c3b54;
            --accent-gold: #f59e0b;
            --accent-gold-glow: rgba(245, 158, 11, 0.25);
            --accent-blue: #3b82f6;
            --text-main: #ffffff;
            --text-muted: #8a99ad;
            --text-sub: #4b586e;
            --font-family: 'Plus Jakarta Sans', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-family); user-select: none; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding-bottom: 60px; }
        
        /* Navigation Bar */
        .navbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 40px; background: rgba(15, 20, 29, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; }
        .logo-container { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .logo-icon { width: 38px; height: 38px; background: linear-gradient(135deg, #f59e0b, #d97706); border-radius: 10px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px var(--accent-gold-glow); }
        .logo-icon i { font-size: 20px; color: #000; }
        .logo-text { font-weight: 800; font-size: 22px; }
        .logo-text .highlight { color: var(--accent-gold); }

        .search-box { background: #141a26; padding: 9px 16px; border-radius: 10px; display: flex; align-items: center; gap: 12px; border: 1px solid var(--border-color); }
        .search-box input { background: transparent; border: none; outline: none; color: var(--text-main); font-size: 14px; width: 200px; }

        /* Main Container */
        .main-container { max-width: 1280px; margin: 30px auto; padding: 0 24px; }
        .hero-banner { background: linear-gradient(180deg, rgba(18, 24, 36, 0.8) 0%, rgba(15, 20, 29, 0.95) 100%), url('https://images.unsplash.com/photo-1627856013091-fed6e4e30025?q=80&w=1200') center/cover; border-radius: 16px; padding: 35px 40px; margin-bottom: 30px; border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; }
        
        /* Category Navigation Bar */
        .category-tabs { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 25px; }
        .tab-btn { background: var(--bg-tab); border: 1px solid var(--border-color); color: var(--text-muted); padding: 10px 18px; border-radius: 12px; font-weight: 700; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 10px; white-space: nowrap; }
        .tab-btn.active { background: var(--bg-tab-active); color: var(--text-main); border-color: var(--accent-gold); }
        .tab-btn svg { width: 18px; height: 18px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }

        .info-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: var(--bg-card); padding: 12px 20px; border-radius: 12px; border: 1px solid var(--border-color); }
        .filter-dropdown { background: #141a26; border: 1px solid var(--border-color); color: var(--text-muted); padding: 8px 12px; border-radius: 8px; font-weight: 600; }
        .server-ip-card { background: #141c28; border: 1px solid var(--border-color); padding: 6px 14px; border-radius: 8px; display: flex; align-items: center; gap: 12px; cursor: pointer; }

        /* Leaderboard Cards & Items */
        .leaderboard { display: flex; flex-direction: column; gap: 12px; }
        .player-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px; padding: 14px 22px; display: flex; align-items: center; gap: 20px; cursor: pointer; transition: 0.2s; }
        .player-card:hover { background: var(--bg-card-hover); border-color: var(--border-highlight); }
        .rank-1 { border-left: 5px solid #f59e0b; background: linear-gradient(90deg, rgba(245, 158, 11, 0.05) 0%, var(--bg-card) 100%); }
        .rank-tag { font-size: 24px; font-weight: 900; color: var(--text-muted); width: 35px; text-align: center; }
        .rank-1 .rank-tag { color: var(--accent-gold); }
        .player-avatar img { width: 50px; height: 50px; border-radius: 10px; background: #141a26; }
        .player-info { flex-grow: 1; }
        .player-name { font-size: 18px; font-weight: 800; }
        .region-tag { padding: 4px 10px; border-radius: 6px; font-weight: 800; font-size: 11px; background: rgba(185, 28, 28, 0.2); color: #f87171; }

        /* Perfected SVG Badges Container */
        .tier-badges { display: flex; gap: 12px; background: #080b10; padding: 8px 14px; border-radius: 10px; border: 1px solid #161e2c; align-items: center; }
        .badge { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .badge svg { width: 24px; height: 24px; display: block; }
        .badge small { font-size: 10px; font-weight: 900; padding: 2px 5px; border-radius: 4px; line-height: 1; }
        .ht { color: #fbbf24; background: rgba(245, 158, 11, 0.18); border: 1px solid rgba(245, 158, 11, 0.3); }
        .lt { color: #60a5fa; background: rgba(59, 130, 246, 0.18); border: 1px solid rgba(59, 130, 246, 0.3); }

        /* Profile Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(4, 6, 10, 0.85); backdrop-filter: blur(8px); justify-content: center; align-items: center; z-index: 1000; }
        .modal { background: var(--bg-card); border: 1px solid var(--border-highlight); padding: 25px; border-radius: 20px; width: 420px; text-align: center; position: relative; }
        .close-btn { position: absolute; top: 14px; right: 16px; font-size: 20px; cursor: pointer; color: var(--text-muted); }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo-container">
            <div class="logo-icon"><i class="fa-solid fa-crown"></i></div>
            <div class="logo-text">SUDARSHAN <span class="highlight">TIERS</span></div>
        </div>
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Search player IGN...">
        </div>
    </header>

    <main class="main-container">
        <div class="hero-banner">
            <div>
                <h1 style="font-size: 30px; font-weight: 800;">Official Competitive Leaderboard</h1>
                <p style="color: var(--text-muted);">Track top tier Minecraft PvP players across various game modes.</p>
            </div>
        </div>

        <div class="category-tabs" id="categoryTabs">
            <button class="tab-btn active" onclick="filterCategory('overall', this)"><i class="fa-solid fa-trophy" style="color: var(--accent-gold);"></i> Overall</button>
            <button class="tab-btn" onclick="filterCategory('crystal', this)" id="tab-crystal">Vanilla</button>
            <button class="tab-btn" onclick="filterCategory('uhc', this)" id="tab-uhc">UHC</button>
            <button class="tab-btn" onclick="filterCategory('pot', this)" id="tab-pot">Pot</button>
            <button class="tab-btn" onclick="filterCategory('nethop', this)" id="tab-nethop">NethOP</button>
            <button class="tab-btn" onclick="filterCategory('smp', this)" id="tab-smp">SMP</button>
            <button class="tab-btn" onclick="filterCategory('sword', this)" id="tab-sword">Sword</button>
            <button class="tab-btn" onclick="filterCategory('axe', this)" id="tab-axe">Axe</button>
            <button class="tab-btn" onclick="filterCategory('mace', this)" id="tab-mace">Mace</button>
        </div>

        <div class="info-bar">
            <select class="filter-dropdown" id="regionFilter" onchange="filterRegion()">
                <option value="all">All Regions</option>
                <option value="NA">North America (NA)</option>
                <option value="EU">Europe (EU)</option>
                <option value="ASIA">Asia (ASIA)</option>
            </select>
            <div class="server-ip-card" onclick="navigator.clipboard.writeText('play.nglord.fun'); alert('Copied Server IP!');">
                <span style="background: #dc2626; color: white; font-size: 10px; font-weight: 900; padding: 3px 6px; border-radius: 4px;">SERVER</span>
                <div>
                    <span style="font-size: 9px; color: var(--text-sub); font-weight: 800; display: block;">CLICK TO COPY IP</span>
                    <span style="font-size: 12px; font-weight: 700; color: var(--accent-gold);">play.nglord.fun <i class="fa-regular fa-copy"></i></span>
                </div>
            </div>
        </div>

        <div class="leaderboard" id="leaderboard"></div>
    </main>

    <div class="modal-overlay" id="playerModal">
        <div class="modal">
            <span class="close-btn" onclick="document.getElementById('playerModal').style.display='none'">&times;</span>
            <img id="modalImg" src="" style="width:70px; height:70px; border-radius:12px; margin-bottom:10px;">
            <h2 id="modalName" style="color:#fff;"></h2>
            <p id="modalRank" style="color:#f59e0b; margin-top:4px; font-weight: bold;"></p>
            <p id="modalPoints" style="color:#8a99ad; margin:4px 0; font-size:13px;"></p>
            <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:16px; margin-top:15px; background:#080b10; padding:18px; border-radius:12px;" id="modalTiers"></div>
        </div>
    </div>

    <script>
        // Inline Vector SVGs (100% Offline & Reliable, No Broken Links Ever!)
        const ITEM_SVGS = {
            crystal: `<svg viewBox="0 0 24 24"><polygon points="12,2 4,7 4,17 12,22 20,17 20,7" fill="#ec4899"/><polygon points="12,5 7,9 7,15 12,18 17,15 17,9" fill="#f472b6"/></svg>`,
            sword: `<svg viewBox="0 0 24 24"><path d="M19 3l1 1-10 10-2-2 10-10zm-9 11l-2 2-2-2-2 2 1 1-2 2 1 1 2-2 1 1 2-2-2-2 2-2z" fill="#38bdf8"/></svg>`,
            uhc: `<svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7" fill="#f59e0b"/><path d="M12 3c-2 0-3 2-3 4h6c0-2-1-4-3-4z" fill="#10b981"/></svg>`,
            pot: `<svg viewBox="0 0 24 24"><path d="M10 3h4v3l4 6v7H6v-7l4-6V3z" fill="#3b82f6"/><rect x="8" y="14" width="8" height="3" fill="#60a5fa"/></svg>`,
            nethop: `<svg viewBox="0 0 24 24"><path d="M12 2L4 6v6c0 5.5 3.8 10.7 8 12 4.2-1.3 8-6.5 8-12V6l-8-4z" fill="#ef4444"/><polygon points="12,6 15,11 12,16 9,11" fill="#fca5a5"/></svg>`,
            smp: `<svg viewBox="0 0 24 24"><path d="M12 2l2.4 7.4H22l-6 4.6 2.3 7.4-6.3-4.6-6.3 4.6 2.3-7.4-6-4.6h7.6z" fill="#10b981"/></svg>`,
            axe: `<svg viewBox="0 0 24 24"><path d="M14 2l5 5-4 4-2-2 1-2-2 1-2-2 4-4zm-8 16l7-7 2 2-7 7H6v-2z" fill="#a855f7"/></svg>`,
            mace: `<svg viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="8" rx="2" fill="#f97316"/><path d="M5 19l7-7 2 2-7 7H5v-2z" fill="#ea580c"/></svg>`
        };

        // Inject icons into category tabs
        Object.keys(ITEM_SVGS).forEach(key => {
            const btn = document.getElementById(`tab-${key}`);
            if (btn) {
                btn.innerHTML = ITEM_SVGS[key] + " " + btn.innerText;
            }
        });

        const playersData = [
            {
                rank: 1, name: "Marlowww", title: "Combat Grandmaster", points: 450, region: "NA", skin: "https://mc-heads.net/avatar/Marlowww/100",
                tiers: [
                    { mode: "sword", level: "HT1", type: "ht" },
                    { mode: "smp", level: "HT1", type: "ht" },
                    { mode: "nethop", level: "HT1", type: "ht" },
                    { mode: "mace", level: "HT1", type: "ht" },
                    { mode: "crystal", level: "HT1", type: "ht" },
                    { mode: "pot", level: "HT1", type: "ht" },
                    { mode: "uhc", level: "LT1", type: "lt" },
                    { mode: "axe", level: "LT1", type: "lt" }
                ]
            },
            {
                rank: 2, name: "ItzRealMe", title: "Combat Master", points: 330, region: "NA", skin: "https://mc-heads.net/avatar/ItzRealMe/100",
                tiers: [
                    { mode: "sword", level: "HT3", type: "ht" },
                    { mode: "nethop", level: "HT1", type: "ht" },
                    { mode: "crystal", level: "HT1", type: "ht" },
                    { mode: "pot", level: "HT1", type: "ht" },
                    { mode: "axe", level: "LT2", type: "lt" }
                ]
            }
        ];

        let currentCat = "overall";

        function renderLeaderboard(data) {
            const container = document.getElementById("leaderboard");
            container.innerHTML = "";

            data.forEach(player => {
                let displayTiers = currentCat === "overall" ? player.tiers : player.tiers.filter(t => t.mode === currentCat);
                if (currentCat !== "overall" && !displayTiers.length) return;

                let badgesHTML = displayTiers.map(t => `
                    <span class="badge">
                        ${ITEM_SVGS[t.mode]}
                        <small class="${t.type}">${t.level}</small>
                    </span>
                `).join('');

                container.innerHTML += `
                    <div class="player-card ${player.rank === 1 ? 'rank-1' : ''}" onclick="openProfile('${player.name}')">
                        <div class="rank-tag">${player.rank}.</div>
                        <div class="player-avatar"><img src="${player.skin}"></div>
                        <div class="player-info">
                            <div class="player-name">${player.name}</div>
                            <div style="font-size:12px; color:var(--text-muted);"><i class="fa-solid fa-gem" style="color:#f59e0b;"></i> ${player.title} (${player.points} pts)</div>
                        </div>
                        <div class="region-tag">${player.region}</div>
                        <div class="tier-badges">${badgesHTML}</div>
                    </div>
                `;
            });
        }

        function filterCategory(cat, btn) {
            currentCat = cat;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderLeaderboard(playersData);
        }

        function filterRegion() {
            let reg = document.getElementById("regionFilter").value;
            renderLeaderboard(reg === "all" ? playersData : playersData.filter(p => p.region === reg));
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            let val = e.target.value.toLowerCase();
            renderLeaderboard(playersData.filter(p => p.name.toLowerCase().includes(val)));
        });

        function openProfile(name) {
            let p = playersData.find(x => x.name === name);
            if (!p) return;
            document.getElementById("modalName").innerText = p.name;
            document.getElementById("modalRank").innerText = p.title;
            document.getElementById("modalPoints").innerText = p.points + " Tier Points (" + p.region + ")";
            document.getElementById("modalImg").src = p.skin;

            document.getElementById("modalTiers").innerHTML = p.tiers.map(t => `
                <span class="badge" style="transform: scale(1.2);">
                    ${ITEM_SVGS[t.mode]}
                    <small class="${t.type}">${t.level}</small>
                </span>
            `).join('');

            document.getElementById("playerModal").style.display = "flex";
        }

        window.onload = () => renderLeaderboard(playersData);
    </script>
</body>
</html>
