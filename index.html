<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUDARSHAN MCTIERS - Ultimate Competitive Leaderboard</title>
    <!-- FontAwesome & Google Fonts -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================================================
           1. CORE SYSTEM VARIABLES & GLOBAL RESETS
           ========================================================================== */
        :root {
            --bg-dark: #07090e;
            --bg-card: #0f141d;
            --bg-card-hover: #161e2b;
            --bg-tab: #121824;
            --bg-tab-active: #1e283b;
            --border-color: #1a2332;
            --border-highlight: #2c3b54;
            --accent-gold: #f59e0b;
            --accent-gold-glow: rgba(245, 158, 11, 0.25);
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-main: #ffffff;
            --text-muted: #8a99ad;
            --text-sub: #4b586e;
            --font-family: 'Plus Jakarta Sans', sans-serif;
            --transition-fast: 0.15s ease;
            --transition-normal: 0.25s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-family);
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 60px;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(245, 158, 11, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 0% 100%, rgba(59, 130, 246, 0.03) 0%, transparent 40%);
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-gold); }

        /* ==========================================================================
           2. NAVIGATION & NAVBAR
           ========================================================================== */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 40px;
            background-color: rgba(15, 20, 29, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px var(--accent-gold-glow);
        }

        .logo-icon i { font-size: 20px; color: #000; }
        .logo-text { font-weight: 800; font-size: 22px; letter-spacing: 0.5px; }
        .logo-text .highlight { color: var(--accent-gold); }

        .nav-links { display: flex; align-items: center; gap: 20px; }
        .nav-item {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition-fast);
            padding: 8px 14px;
            border-radius: 8px;
        }

        .nav-item:hover, .nav-item.active {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
        }
        .nav-item.active { border-bottom: 2px solid var(--accent-gold); }

        .search-box {
            background: #141a26;
            padding: 9px 16px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid var(--border-color);
            transition: var(--transition-normal);
        }
        .search-box:focus-within { border-color: var(--accent-gold); box-shadow: 0 0 12px var(--accent-gold-glow); }
        .search-box i { color: var(--text-muted); font-size: 14px; }
        .search-box input { background: transparent; border: none; outline: none; color: var(--text-main); font-size: 14px; width: 200px; }

        /* ==========================================================================
           3. CONTAINER & HERO BANNER
           ========================================================================== */
        .main-container { max-width: 1280px; margin: 30px auto; padding: 0 24px; }

        .hero-banner {
            background: linear-gradient(180deg, rgba(18, 24, 36, 0.8) 0%, rgba(15, 20, 29, 0.95) 100%), url('https://images.unsplash.com/photo-1627856013091-fed6e4e30025?q=80&w=1200') center/cover;
            border-radius: 16px;
            padding: 35px 40px;
            margin-bottom: 30px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .hero-title { font-size: 30px; font-weight: 800; margin-bottom: 8px; }
        .hero-subtitle { font-size: 14px; color: var(--text-muted); max-width: 600px; }

        .hero-stats { display: flex; gap: 20px; }
        .stat-box { background: rgba(10, 14, 22, 0.8); padding: 12px 20px; border-radius: 12px; border: 1px solid var(--border-color); text-align: center; }
        .stat-value { font-size: 22px; font-weight: 800; color: var(--accent-gold); }
        .stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; }

        /* ==========================================================================
           4. CATEGORY TABS & FILTER BAR
           ========================================================================== */
        .category-tabs { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 25px; }
        .tab-btn {
            background: var(--bg-tab);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: var(--transition-normal);
            white-space: nowrap;
        }

        .tab-btn:hover { background: var(--bg-card-hover); color: var(--text-main); border-color: var(--border-highlight); transform: translateY(-2px); }
        .tab-btn.active { background: var(--bg-tab-active); color: var(--text-main); border-color: var(--accent-gold); box-shadow: 0 4px 15px rgba(245, 158, 11, 0.15); }
        .tab-btn i { font-size: 16px; }

        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: var(--bg-card);
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .filter-dropdown { background: #141a26; border: 1px solid var(--border-color); color: var(--text-muted); padding: 8px 12px; border-radius: 8px; font-weight: 600; font-size: 13px; outline: none; }
        .server-ip-card { background: #141c28; border: 1px solid var(--border-color); padding: 6px 14px; border-radius: 8px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: var(--transition-fast); }
        .server-ip-card:hover { border-color: var(--accent-gold); background: #1a2434; }
        .pvp-badge { background: #dc2626; color: white; font-size: 10px; font-weight: 900; padding: 3px 6px; border-radius: 4px; }
        .ip-label { font-size: 9px; color: var(--text-sub); font-weight: 800; display: block; }
        .ip-address { font-size: 12px; font-weight: 700; color: var(--accent-gold); }

        /* ==========================================================================
           5. LEADERBOARD LIST & CARDS
           ========================================================================== */
        .leaderboard { display: flex; flex-direction: column; gap: 12px; }
        .player-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px 22px;
            display: flex;
            align-items: center;
            gap: 20px;
            cursor: pointer;
            transition: var(--transition-normal);
        }

        .player-card:hover { transform: translateY(-2px); background: var(--bg-card-hover); border-color: var(--border-highlight); }
        .rank-1 { border-left: 5px solid #f59e0b; background: linear-gradient(90deg, rgba(245, 158, 11, 0.05) 0%, var(--bg-card) 100%); }
        .rank-2 { border-left: 5px solid #94a3b8; }
        .rank-3 { border-left: 5px solid #b45309; }

        .rank-tag { font-size: 24px; font-weight: 900; font-style: italic; color: var(--text-muted); width: 35px; text-align: center; }
        .rank-1 .rank-tag { color: var(--accent-gold); }

        .player-avatar img { width: 50px; height: 50px; border-radius: 10px; background: #141a26; border: 1px solid var(--border-color); }
        .player-info { flex-grow: 1; }
        .player-name { font-size: 18px; font-weight: 800; color: var(--text-main); }
        .player-title { font-size: 12px; color: var(--text-muted); font-weight: 600; margin-top: 2px; }

        .region-tag { padding: 4px 10px; border-radius: 6px; font-weight: 800; font-size: 11px; }
        .region-tag.na { background: rgba(185, 28, 28, 0.2); color: #f87171; border: 1px solid rgba(185, 28, 28, 0.4); }
        .region-tag.eu { background: rgba(21, 128, 61, 0.2); color: #4ade80; border: 1px solid rgba(21, 128, 61, 0.4); }
        .region-tag.asia { background: rgba(180, 83, 9, 0.2); color: #fbbf24; border: 1px solid rgba(180, 83, 9, 0.4); }

        .tier-badges { display: flex; gap: 10px; background: #080b10; padding: 8px 14px; border-radius: 10px; border: 1px solid #161e2c; }
        .badge { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .badge i { font-size: 18px; }
        .badge small { font-size: 9px; font-weight: 900; padding: 1px 4px; border-radius: 3px; }
        .ht { color: var(--accent-gold); background: rgba(245, 158, 11, 0.15); }
        .lt { color: var(--accent-blue); background: rgba(59, 130, 246, 0.15); }

        /* ==========================================================================
           6. MODAL & OVERLAYS
           ========================================================================== */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(4, 6, 10, 0.85); backdrop-filter: blur(8px); justify-content: center; align-items: center; z-index: 1000; }
        .modal { background: var(--bg-card); border: 1px solid var(--border-highlight); padding: 25px; border-radius: 20px; width: 400px; text-align: center; position: relative; }
        .close-btn { position: absolute; top: 14px; right: 16px; font-size: 20px; cursor: pointer; color: var(--text-muted); }
        .modal-tier-box { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 15px; background: #080b10; padding: 15px; border-radius: 10px; border: 1px solid var(--border-color); }

        @media (max-width: 768px) {
            .navbar { padding: 16px 20px; }
            .hero-banner { flex-direction: column; text-align: center; gap: 15px; }
            .player-card { flex-wrap: wrap; }
            .tier-badges { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <!-- Navigation Header -->
    <header class="navbar">
        <div class="logo-container">
            <div class="logo-icon"><i class="fa-solid fa-crown"></i></div>
            <div class="logo-text">SUDARSHAN <span class="highlight">TIERS</span></div>
        </div>
        <nav class="nav-links">
            <a href="#" class="nav-item active"><i class="fa-solid fa-trophy"></i> Rankings</a>
            <a href="https://discord.gg/zJbyq9TJR" target="_blank" class="nav-item"><i class="fa-brands fa-discord"></i> Discord</a>
        </nav>
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Search player IGN...">
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-container">
        <div class="hero-banner">
            <div>
                <h1 class="hero-title">Official Competitive Leaderboard</h1>
                <p class="hero-subtitle">Track top tier Minecraft PvP players across various game modes including Vanilla, Sword, SMP, Pot, and Mace combat.</p>
            </div>
            <div class="hero-stats">
                <div class="stat-box">
                    <div class="stat-value" id="totalCount">0</div>
                    <div class="stat-label">Players</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value">v2.4</div>
                    <div class="stat-label">Season</div>
                </div>
            </div>
        </div>

        <!-- Category Tabs -->
        <div class="category-tabs" id="categoryTabs">
            <button class="tab-btn active" onclick="filterCategory('overall', this)"><i class="fa-solid fa-trophy" style="color: var(--accent-gold);"></i> Overall</button>
            <button class="tab-btn" onclick="filterCategory('crystal', this)"><i class="fa-solid fa-gem" style="color: #ec4899;"></i> Vanilla</button>
            <button class="tab-btn" onclick="filterCategory('uhc', this)"><i class="fa-solid fa-apple-whole" style="color: #f59e0b;"></i> UHC</button>
            <button class="tab-btn" onclick="filterCategory('pot', this)"><i class="fa-solid fa-flask" style="color: #3b82f6;"></i> Pot</button>
            <button class="tab-btn" onclick="filterCategory('nethop', this)"><i class="fa-solid fa-shield" style="color: #ef4444;"></i> NethOP</button>
            <button class="tab-btn" onclick="filterCategory('smp', this)"><i class="fa-solid fa-ankh" style="color: #10b981;"></i> SMP</button>
            <button class="tab-btn" onclick="filterCategory('sword', this)"><i class="fa-solid fa-hand-fist" style="color: #cbd5e1;"></i> Sword</button>
            <button class="tab-btn" onclick="filterCategory('axe', this)"><i class="fa-solid fa-gavel" style="color: #a855f7;"></i> Axe</button>
            <button class="tab-btn" onclick="filterCategory('mace', this)"><i class="fa-solid fa-hammer" style="color: #f97316;"></i> Mace</button>
        </div>

        <!-- Filter Controls Bar -->
        <div class="info-bar">
            <select class="filter-dropdown" id="regionFilter" onchange="filterRegion()">
                <option value="all">All Regions</option>
                <option value="NA">North America (NA)</option>
                <option value="EU">Europe (EU)</option>
                <option value="ASIA">Asia (ASIA)</option>
            </select>
            <div class="server-ip-card" onclick="copyIp()">
                <span class="pvp-badge">SERVER</span>
                <div>
                    <span class="ip-label">CLICK TO COPY IP</span>
                    <span class="ip-address">play.nglord.fun <i class="fa-regular fa-copy"></i></span>
                </div>
            </div>
        </div>

        <!-- Leaderboard List -->
        <div class="leaderboard" id="leaderboard"></div>
    </main>

    <!-- Modal Popup -->
    <div class="modal-overlay" id="playerModal">
        <div class="modal">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <img id="modalImg" src="" style="width:70px; height:70px; border-radius:12px; margin-bottom:10px;">
            <h2 id="modalName" style="color:#fff;">Name</h2>
            <p id="modalRank" style="color:#f59e0b; margin-top:4px; font-weight: bold;"></p>
            <p id="modalPoints" style="color:#8a99ad; margin:4px 0; font-size:13px;"></p>
            <div class="modal-tier-box" id="modalTiers"></div>
        </div>
    </div>

    <!-- Application Engine Logic -->
    <script>
        const ICON_MAP = {
            crystal: { class: "fa-solid fa-gem", color: "#ec4899" },
            sword: { class: "fa-solid fa-hand-fist", color: "#cbd5e1" },
            uhc: { class: "fa-solid fa-apple-whole", color: "#f59e0b" },
            pot: { class: "fa-solid fa-flask", color: "#3b82f6" },
            nethop: { class: "fa-solid fa-shield", color: "#ef4444" },
            smp: { class: "fa-solid fa-ankh", color: "#10b981" },
            axe: { class: "fa-solid fa-gavel", color: "#a855f7" },
            mace: { class: "fa-solid fa-hammer", color: "#f97316" }
        };

        const playersData = [
            {
                rank: 1, name: "Marlowww", title: "Combat Grandmaster", points: 450, region: "NA", skin: "https://mc-heads.net/avatar/Marlowww/100",
                tiers: [
                    { mode: "sword", level: "HT1", type: "ht" },
                    { mode: "smp", level: "HT1", type: "ht" },
                    { mode: "nethop", level: "HT1", type: "ht" },
                    { mode: "mace", level: "HT1", type: "ht" },
                    { mode: "crystal", level: "HT1", type: "ht" },
                    { mode: "pot", level: "HT1", type: "ht" },
                    { mode: "uhc", level: "LT1", type: "lt" },
                    { mode: "axe", level: "LT1", type: "lt" }
                ]
            },
            {
                rank: 2, name: "ItzRealMe", title: "Combat Master", points: 330, region: "NA", skin: "https://mc-heads.net/avatar/ItzRealMe/100",
                tiers: [
                    { mode: "sword", level: "HT3", type: "ht" },
                    { mode: "nethop", level: "HT1", type: "ht" },
                    { mode: "crystal", level: "HT1", type: "ht" },
                    { mode: "pot", level: "HT1", type: "ht" },
                    { mode: "axe", level: "LT2", type: "lt" }
                ]
            },
            {
                rank: 3, name: "coldified", title: "Combat Master", points: 326, region: "EU", skin: "https://mc-heads.net/avatar/coldified/100",
                tiers: [
                    { mode: "pot", level: "LT1", type: "lt" },
                    { mode: "crystal", level: "LT3", type: "lt" },
                    { mode: "uhc", level: "HT1", type: "ht" },
                    { mode: "axe", level: "LT1", type: "lt" }
                ]
            },
            {
                rank: 4, name: "Swight", title: "Combat Expert", points: 290, region: "NA", skin: "https://mc-heads.net/avatar/Swight/100",
                tiers: [
                    { mode: "smp", level: "HT2", type: "ht" },
                    { mode: "mace", level: "LT1", type: "lt" },
                    { mode: "sword", level: "HT1", type: "ht" }
                ]
            },
            {
                rank: 5, name: "SudarshanPvP", title: "Combat Expert", points: 275, region: "ASIA", skin: "https://mc-heads.net/avatar/Steve/100",
                tiers: [
                    { mode: "crystal", level: "HT1", type: "ht" },
                    { mode: "sword", level: "HT2", type: "ht" },
                    { mode: "pot", level: "LT1", type: "lt" }
                ]
            }
        ];

        let currentCategory = "overall";

        function renderLeaderboard(data) {
            const container = document.getElementById("leaderboard");
            container.innerHTML = "";

            if (!data.length) {
                container.innerHTML = `<div style="text-align:center; padding: 40px; color: var(--text-muted);">No players found.</div>`;
                return;
            }

            data.forEach(player => {
                let rankClass = player.rank === 1 ? "rank-1" : player.rank === 2 ? "rank-2" : player.rank === 3 ? "rank-3" : "";
                
                let displayTiers = currentCategory === "overall" ? player.tiers : player.tiers.filter(t => t.mode === currentCategory);
                if (currentCategory !== "overall" && !displayTiers.length) return;

                let badgesHTML = displayTiers.map(t => {
                    let iconInfo = ICON_MAP[t.mode] || { class: "fa-solid fa-shield", color: "#ffffff" };
                    return `
                        <span class="badge">
                            <i class="${iconInfo.class}" style="color: ${iconInfo.color}"></i>
                            <small class="${t.type}">${t.level}</small>
                        </span>
                    `;
                }).join('');

                container.innerHTML += `
                    <div class="player-card ${rankClass}" onclick="openProfile('${player.name}')">
                        <div class="rank-tag">${player.rank}.</div>
                        <div class="player-avatar"><img src="${player.skin}" alt="${player.name}"></div>
                        <div class="player-info">
                            <div class="player-name">${player.name}</div>
                            <div class="player-title"><i class="fa-solid fa-gem" style="color:#f59e0b;"></i> ${player.title} <span style="color:#64748b;">(${player.points} pts)</span></div>
                        </div>
                        <div class="region-tag ${player.region.toLowerCase()}">${player.region}</div>
                        <div class="tier-badges">${badgesHTML}</div>
                    </div>
                `;
            });

            document.getElementById("totalCount").innerText = playersData.length;
        }

        function filterCategory(category, btn) {
            currentCategory = category;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderLeaderboard(playersData);
        }

        function filterRegion() {
            let reg = document.getElementById("regionFilter").value;
            renderLeaderboard(reg === "all" ? playersData : playersData.filter(p => p.region === reg));
        }

        document.getElementById('searchInput').addEventListener('input', function(e) {
            let val = e.target.value.toLowerCase();
            renderLeaderboard(playersData.filter(p => p.name.toLowerCase().includes(val)));
        });

        function openProfile(name) {
            let p = playersData.find(x => x.name === name);
            if (!p) return;

            document.getElementById("modalName").innerText = p.name;
            document.getElementById("modalRank").innerText = p.title;
            document.getElementById("modalPoints").innerText = p.points + " Tier Points (" + p.region + ")";
            document.getElementById("modalImg").src = p.skin;

            let badgesHTML = p.tiers.map(t => {
                let iconInfo = ICON_MAP[t.mode] || { class: "fa-solid fa-shield", color: "#ffffff" };
                return `
                    <span class="badge" style="transform: scale(1.1);">
                        <i class="${iconInfo.class}" style="color: ${iconInfo.color}"></i>
                        <small class="${t.type}">${t.level}</small>
                    </span>
                `;
            }).join('');

            document.getElementById("modalTiers").innerHTML = badgesHTML;
            document.getElementById("playerModal").style.display = "flex";
        }

        function closeModal() { document.getElementById("playerModal").style.display = "none"; }
        function copyIp() { navigator.clipboard.writeText("play.nglord.fun"); alert("Copied Server IP: play.nglord.fun"); }

        window.onload = () => renderLeaderboard(playersData);
    </script>
</body>
</html>
