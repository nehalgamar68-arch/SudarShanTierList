<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudharshan Tiers - Rankings</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        :root {
            --neon-cyan: #00fff2;
            --neon-pink: #ff2fd6;
            --neon-purple: #b026ff;
            --neon-gold: #ffe600;
            --bg-black: #050509;
            --panel: #0c0d16;
            --panel-border: #1c1d33;
        }
        body {
            background-color: var(--bg-black);
            background-image:
                radial-gradient(circle at 15% 10%, rgba(255,47,214,0.07), transparent 40%),
                radial-gradient(circle at 85% 20%, rgba(0,255,242,0.07), transparent 40%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            font-weight: 700;
        }
        .site-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--panel-border);
        }
        .brand { display:flex; align-items:center; gap:12px; }
        .brand img { height:34px; width:34px; border-radius:6px; object-fit:cover; display:none; }
        .logo {
            font-weight: 900;
            letter-spacing: 2px;
            font-size: 26px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 18px rgba(0,255,242,0.35);
            text-transform: uppercase;
        }
        .header-buttons button, .header-buttons a {
            display: inline-block;
            padding: 9px 18px;
            border-radius: 6px;
            border: none;
            font-weight: 900;
            cursor: pointer;
            margin-left: 10px;
            letter-spacing: .5px;
            text-transform: uppercase;
            font-size: 13px;
            text-decoration: none;
        }
        .btn-orange { background: var(--neon-pink); color: #000; box-shadow: 0 0 14px rgba(255,47,214,0.6); }
        .btn-dark { background: var(--panel); color: var(--neon-cyan); border: 1px solid var(--neon-cyan); box-shadow: 0 0 10px rgba(0,255,242,0.25); }
        .btn-discord { background: #5865F2; color: #fff; box-shadow: 0 0 14px rgba(88,101,242,0.6); }

        .category-nav { display: flex; gap: 10px; margin: 20px 0; overflow-x: auto; padding-bottom: 5px; }
        .tab {
            background: var(--panel); border: 1px solid var(--panel-border); color: #8b91ac;
            padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 900;
            white-space: nowrap; display: flex; align-items: center; gap: 8px; font-size: 13px;
        }
        .tab.active {
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
            color: #000; border-color: transparent;
            box-shadow: 0 0 16px rgba(0,255,242,0.5), 0 0 16px rgba(255,47,214,0.4);
        }

        .filter-bar { display: flex; gap: 15px; margin-bottom: 25px; align-items:center; }
        .search-input, .region-select {
            background: var(--panel); border: 1px solid var(--panel-border); padding: 10px 15px;
            border-radius: 6px; color: #fff; outline: none; font-weight: 700;
        }
        .search-input { width: 250px; }
        .status-pill { font-size:11px; font-weight:800; color:#8b91ac; margin-left:auto; display:flex; align-items:center; gap:8px; }
        .status-dot { width:8px; height:8px; border-radius:50%; background:#3dffa0; box-shadow:0 0 8px #3dffa0; }
        .status-dot.err { background:#ff6b6b; box-shadow:0 0 8px #ff6b6b; }
        .refresh-btn { background: var(--panel); border: 1px solid var(--panel-border); color: var(--neon-cyan); border-radius:6px; padding:8px 12px; cursor:pointer; font-weight:800; font-size:12px; }

        .leaderboard-container { max-width: 1200px; margin: 0 auto; }
        .player-card {
            display: flex; align-items: center; background: var(--panel); gap: 14px;
            margin-bottom: 14px; padding: 8px 20px 8px 8px; border-radius: 8px;
            justify-content: space-between; border: 1px solid var(--panel-border);
            cursor: pointer; transition: transform .12s, border-color .12s;
        }
        .player-card:hover { transform: translateX(4px); border-color: var(--neon-cyan); }
        /* Authentic MCTiers-style rank box: diagonal-cut shimmer background with the bust overlapping */
        .rank-box {
            position: relative; width: 150px; height: 64px; flex-shrink: 0;
            overflow: hidden; border-radius: 6px;
            clip-path: polygon(0 0, 100% 0, 82% 100%, 0 100%);
        }
        .rank-box .shimmer-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        .rank-box .rank-number {
            position: absolute; bottom: 4px; left: 8px; font-size: 26px; font-weight: 900;
            font-style: italic; color: #fff; text-shadow: 0 3px 2px rgba(0,0,0,.7); z-index: 2;
        }
        .rank-box .bust {
            position: absolute; right: 10px; bottom: 0; height: 60px; width: auto;
            filter: drop-shadow(-3px -2px 3px rgba(0,0,0,.55)); z-index: 1;
        }
        .player-info { display: flex; align-items: center; gap: 15px; flex-grow: 1; }
        .player-name { font-weight: 900; font-size: 17px; display: block; color: #fff; letter-spacing: .3px; }
        .player-title { font-size: 11px; color: #8b91ac; text-transform: uppercase; font-weight: 800; }
        .points { color: var(--neon-cyan); text-shadow: 0 0 8px rgba(0,255,242,0.5); }
        .region-badge {
            padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 900; margin-right: 20px;
        }
        .badges { display: flex; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
        .tier-badge { display: flex; flex-direction: column; align-items: center; gap: 5px; width: 42px; }
        .tier-icon {
            width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 14px; background: var(--bg-black); border: 2px solid;
        }
        .tier-icon.vanilla    { color: #ff5f8f; border-color: #ff5f8f; box-shadow: 0 0 8px #ff5f8f66; }
        .tier-icon.sword      { color: var(--neon-cyan); border-color: var(--neon-cyan); box-shadow: 0 0 8px #00fff266; }
        .tier-icon.nethpot    { color: var(--neon-purple); border-color: var(--neon-purple); box-shadow: 0 0 8px #b026ff66; }
        .tier-icon.diamondpot { color: #29e0ff; border-color: #29e0ff; box-shadow: 0 0 8px #29e0ff66; }
        .tier-icon.uhc        { color: #3dffa0; border-color: #3dffa0; box-shadow: 0 0 8px #3dffa066; }
        .tier-icon.mace       { color: #ffa657; border-color: #ffa657; box-shadow: 0 0 8px #ffa65766; }
        .tier-icon.smp        { color: var(--neon-pink); border-color: var(--neon-pink); box-shadow: 0 0 8px #ff2fd666; }
        .tier-icon img { width: 22px; height: 22px; object-fit: contain; }
        .nav-icon { width: 16px; height: 16px; object-fit: contain; vertical-align: -3px; }
        .tier-label { font-size: 10px; font-weight: 900; letter-spacing: .3px; padding: 2px 6px; border-radius: 4px; }
        /* Authentic MCTiers tier-code colors, dark pill background like the real site */
        .tier-label { background: #1e2634; }
        .tier-label.ht1 { color: #e8ba3a; }
        .tier-label.ht2 { color: #c4d3e7; }
        .tier-label.ht3 { color: #f89f5a; }
        .tier-label.ht4 { color: #a99bcc; }
        .tier-label.ht5 { color: #8f82a8; }
        .tier-label.lt1 { color: #d5b355; }
        .tier-label.lt2 { color: #a0a7b2; }
        .tier-label.lt3 { color: #c67b42; }
        .tier-label.lt4 { color: #8b81a3; }
        .tier-label.lt5 { color: #655b79; }
        .empty { text-align:center; color:#8b91ac; font-size:13px; padding: 40px 0; }

        .fallback-banner {
            display: none; max-width: 1200px; margin: 0 auto 14px; padding: 10px 16px;
            border-radius: 6px; background: #2b220a; border: 1px solid #4a3a12;
            color: #ffb347; font-size: 12px; font-weight: 700;
        }
        .fallback-banner.show { display: block; }

        /* Deliberately near-invisible admin entry point, top-left corner. */
        .admin-corner-btn {
            position: fixed; left: 6px; top: 6px; z-index: 100;
            font-size: 10px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase;
            color: rgba(255,255,255,0.06); text-decoration: none;
            padding: 6px 10px; border-radius: 4px; transition: color .2s, background .2s;
        }
        .admin-corner-btn:hover { color: rgba(0,255,242,0.7); background: rgba(255,255,255,0.03); }

        .modal-bg {
            position: fixed; inset: 0; background: rgba(0,0,0,.75); display: flex; align-items: center; justify-content: center;
            z-index: 200; padding: 20px; opacity: 0; pointer-events: none; transition: opacity .22s ease;
        }
        .modal-bg.show { opacity: 1; pointer-events: auto; }
        .modal-bg .player-modal { transform: scale(.94) translateY(8px); transition: transform .22s cubic-bezier(.2,.8,.2,1); }
        .modal-bg.show .player-modal { transform: scale(1) translateY(0); }
        .player-modal {
            background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
            width: 420px; max-width: 100%; max-height: 88vh; overflow-y: auto; padding: 28px 24px; position: relative;
            box-shadow: 0 0 40px rgba(0,255,242,0.08);
        }
        .modal-close {
            position: absolute; top: 14px; right: 14px; width: 32px; height: 32px; border-radius: 50%;
            background: var(--bg-black); border: 1px solid var(--panel-border); color: #fff; cursor: pointer; font-size: 14px;
        }
        .modal-avatar-wrap { display: flex; justify-content: center; margin-bottom: 12px; }
        .modal-avatar-wrap img { width: 90px; height: 90px; object-fit: contain; filter: drop-shadow(0 0 14px rgba(0,255,242,.25)); }
        .modal-name { text-align: center; font-size: 24px; font-weight: 900; color: #fff; }
        .modal-title-pill {
            display: block; text-align: center; margin: 10px auto 0; width: fit-content; padding: 6px 16px;
            border-radius: 20px; background: #1e2634; color: var(--neon-gold); font-weight: 800; font-size: 12px; text-transform: uppercase;
        }
        .modal-region { text-align: center; margin-top: 10px; }
        .modal-section-label { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: #8b91ac; font-weight: 800; margin: 22px 0 8px; }
        .modal-position { display: flex; align-items: center; gap: 10px; background: var(--panel-2, #10111d); border: 1px solid var(--panel-border); border-radius: 8px; padding: 12px 14px; font-weight: 900; }
        .modal-position .rank-big { font-size: 22px; color: var(--neon-cyan); }
        .modal-tiers-grid { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; margin-top: 6px; }
    </style>
</head>

    function calcPoints(p){
        let total = 0;
        for (const gm of GAMEMODES){
            const t = p.tiers[gm];
            if (t && POINTS[t] !== undefined) total += POINTS[t];
        }
        return total;
    }

    function avatarUrl(p){
        return p.skin ? p.skin : `https://minotar.net/avatar/${encodeURIComponent(p.name)}/50.png`;
    }

    function shimmerForRank(i){
        if (i === 0) return SHIMMER["1"];
        if (i === 1) return SHIMMER["2"];
        if (i === 2) return SHIMMER["3"];
        return SHIMMER["other"];
    }

    function levelClass(tier){
        return tier.toLowerCase(); // "HT4" -> "ht4", matches authentic color classes
    }

    // Authentic MCTiers region colors
    const REGION_COLORS = {
        NA: { bg: "#442228", fg: "#d95c6a" },
        EU: { bg: "#1c3e20", fg: "#89f19c" },
        AS: { bg: "#422c3f", fg: "#af7f91" },
        AU: { bg: "#392e27", fg: "#d5ad80" },
        SA: { bg: "#193845", fg: "#5dccdc" },
        ME: { bg: "#4d4525", fg: "#e5d386" }
    };
    function regionStyle(region){
        const c = REGION_COLORS[(region || '').toUpperCase()] || { bg: "#1e2634", fg: "#8b91ac" };
        return `background:${c.bg}; color:${c.fg};`;
    }

    // Dynamic title based on points, thresholds taken from the real site's data
    function titleFor(points){
        if (points >= 400) return "Combat Grandmaster";
        if (points >= 250) return "Combat Master";
        if (points >= 100) return "Combat Ace";
        return "Combat Rookie";
    }

    function renderList(){
        const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
        const region = document.getElementById('regionSelect').value;
        const board = document.getElementById('leaderboard');

        let list = allPlayers.filter(p =>
            (!q || p.name.toLowerCase().includes(q)) &&
            (!region || (p.region || '').toUpperCase() === region)
        );
        list = list.slice().sort((a,b) => calcPoints(b) - calcPoints(a));

        if (!list.length){
            board.innerHTML = '<div class="empty">No players match.</div>';
            return;
        }

        board.innerHTML = list.map((p, i) => {
            const badges = GAMEMODES.filter(gm => p.tiers[gm]).map(gm => `
                <div class="tier-badge">
                    <div class="tier-icon ${gm}"><img src="${GAMEMODE_ICONS[gm]}" alt="${gm}"></div>
                    <span class="tier-label ${levelClass(p.tiers[gm])}">${p.tiers[gm]}</span>
                </div>
            `).join('');

            return `
            <div class="player-card" data-player-name="${p.name.replace(/"/g,'&quot;')}">
                <div class="rank-box">
                    <img class="shimmer-img" src="${shimmerForRank(i)}" alt="">
                    <span class="rank-number">${i+1}.</span>
                    <img class="bust" src="${avatarUrl(p)}" alt="Avatar">
                </div>
                <div class="player-info">
                    <div>
                        <span class="player-name">${p.name}</span>
                        <span class="player-title">${titleFor(calcPoints(p))} <span class="points">(${calcPoints(p)} points)</span></span>
                    </div>
                </div>
                <div class="region-badge" style="${regionStyle(p.region)}">${p.region || '-'}</div>
                <div class="badges">${badges || '<span style="color:#8b91ac; font-size:11px;">Unranked</span>'}</div>
            </div>`;
        }).join('');

        board.querySelectorAll('.player-card').forEach(card => {
            card.addEventListener('click', () => { playClickSound(); openPlayerModal(card.dataset.playerName); });
        });
    }

    function setStatus(ok, text){
        document.getElementById('statusDot').classList.toggle('err', !ok);
        document.getElementById('statusText').textContent = text;
    }

    async function loadConfig(){
        try{
            const res = await fetch(APPS_SCRIPT_URL + "?type=config");
            const text = await res.text();
            const parsed = Papa.parse(text, { header:true, skipEmptyLines:true });
            let logoUrl = "", siteName = "";
            for (const row of parsed.data){
                const k = (row.key||'').trim().toLowerCase();
                const v = (row.value||'').trim();
                if (k === 'logo_url') logoUrl = v;
                if (k === 'site_name') siteName = v;
            }
            if (siteName) document.getElementById('brandTitle').textContent = siteName;
            const img = document.getElementById('brandLogo');
            if (logoUrl){ img.src = logoUrl; img.style.display = 'inline-block'; }
        }catch(e){ /* config is optional, keep defaults */ }
    }

    async function loadPlayers(){
        setStatus(true, 'Loading live data...');
        try{
            const res = await fetch(APPS_SCRIPT_URL + "?type=players");
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const text = await res.text();
            const parsed = Papa.parse(text, { header:true, skipEmptyLines:true });
            allPlayers = parsed.data.filter(r => r.name).map(r => {
                const tiers = {};
                GAMEMODES.forEach(gm => tiers[gm] = (r[gm] || '').toUpperCase());
                return { name: r.name.trim(), skin: (r.skin||'').trim(), region: (r.region||'').trim(), tiers };
            });
            renderList();
            setStatus(true, `Live — ${allPlayers.length} players synced`);
        }catch(e){
            setStatus(false, 'Blocked here - showing demo data (see banner below).');
            allPlayers = FALLBACK_PLAYERS;
            renderList();
            const banner = document.getElementById('fallbackBanner');
            banner.classList.add('show');
            banner.innerHTML =
                '<strong>Showing demo data.</strong> Live sheet is unreachable from this preview ' +
                '(the Claude chat window blocks outside requests) - download this file and open it in a normal ' +
                'browser, or host it, to see the real live rankings. ' +
                '<button class="refresh-btn" style="margin-left:8px;" onclick="loadPlayers()">Retry</button>';
        }
    }

    // Smooth synthesized click sound -- no external audio file needed.
    let audioCtx = null;
    function playClickSound(){
        try{
            audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
            const t = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(720, t);
            osc.frequency.exponentialRampToValueAtTime(360, t + 0.14);
            gain.gain.setValueAtTime(0.0001, t);
            gain.gain.exponentialRampToValueAtTime(0.22, t + 0.012);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start(t);
            osc.stop(t + 0.24);
        }catch(e){ /* audio unavailable, fail silently */ }
    }

    function openPlayerModal(name){
        const p = allPlayers.find(pl => pl.name === name);
        if (!p) return;

        const ranked = allPlayers.slice().sort((a,b) => calcPoints(b) - calcPoints(a));
        const rank = ranked.findIndex(pl => pl.name === name) + 1;
        const pts = calcPoints(p);

        document.getElementById('modalAvatar').src = avatarUrl(p);
        document.getElementById('modalName').textContent = p.name;
        document.getElementById('modalTitlePill').textContent = titleFor(pts);
        const regionEl = document.getElementById('modalRegion');
        regionEl.textContent = p.region || '-';
        regionEl.setAttribute('style', regionStyle(p.region) + ' margin-right:0;');
        document.getElementById('modalRank').textContent = '#' + rank;
        document.getElementById('modalPointsText').innerHTML = '<i class="fa-solid fa-trophy" style="color:var(--neon-gold); margin-right:6px;"></i>OVERALL (' + pts + ' points)';

        document.getElementById('modalTiersGrid').innerHTML = GAMEMODES.map(gm => {
            const tier = p.tiers[gm];
            return `
            <div class="tier-badge">
                <div class="tier-icon ${gm}"><img src="${GAMEMODE_ICONS[gm]}" alt="${gm}"></div>
                <span class="tier-label ${tier ? levelClass(tier) : ''}">${tier || '-'}</span>
            </div>`;
        }).join('');

        document.getElementById('playerModalBg').classList.add('show');
    }
    function closePlayerModal(){ playClickSound(); document.getElementById('playerModalBg').classList.remove('show'); }
    document.getElementById('modalCloseBtn').addEventListener('click', closePlayerModal);
    document.getElementById('playerModalBg').addEventListener('click', (e) => {
        if (e.target.id === 'playerModalBg') closePlayerModal();
    });

    document.getElementById('searchInput').addEventListener('input', renderList);
    document.getElementById('regionSelect').addEventListener('change', renderList);
    document.getElementById('refreshBtn').addEventListener('click', () => { loadConfig(); loadPlayers(); });

    loadConfig();
    loadPlayers();
    // Light auto-refresh so the page stays close to live without a manual click.
    setInterval(loadPlayers, 30000);
</script>
